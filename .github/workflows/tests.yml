name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Laravel ${{ matrix.laravel }} · PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { laravel: 10, testbench: 8, php: '8.1' }
          - { laravel: 10, testbench: 8, php: '8.2' }
          - { laravel: 10, testbench: 8, php: '8.3' }
          - { laravel: 11, testbench: 9, php: '8.2' }
          - { laravel: 11, testbench: 9, php: '8.3' }
          - { laravel: 11, testbench: 9, php: '8.4' }
          - { laravel: 12, testbench: 10, php: '8.2' }
          - { laravel: 12, testbench: 10, php: '8.3' }
          - { laravel: 12, testbench: 10, php: '8.4' }
          - { laravel: 12, testbench: 10, php: '8.5' }
          - { laravel: 13, testbench: 11, php: '8.3' }
          - { laravel: 13, testbench: 11, php: '8.4' }
          - { laravel: 13, testbench: 11, php: '8.5' }
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: composer:v2

      # Every Laravel 10 and 11 release has published advisories (both are past security support),
      # and Composer refuses to install such releases by default. This affects the test install only.
      - run: composer config policy.advisories.block false

      - run: composer require "laravel/framework:^${{ matrix.laravel }}.0" "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update --no-interaction

      - run: composer update --prefer-dist --prefer-stable --no-interaction

      - run: vendor/bin/pest

  static:
    name: Pint and PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - run: composer update --prefer-dist --no-interaction

      - run: vendor/bin/pint --test

      - run: vendor/bin/phpstan analyse --no-progress
